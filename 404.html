<!DOCTYPE html>
<html lang="es">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' http://localhost:3000 https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src https://docs.google.com" />
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color por esquema, coherente con el toggle data-mode de uiStore. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090C" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F1F8" />
    <!-- iOS lee el ícono de acá, NO del manifest (ignora los íconos SVG). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Generador de horarios" />
    <!-- Fuentes self-hosted (@font-face en style.css). Se precargan las del
         subset latin, que son las que se usan siempre. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <!-- GA4 se carga diferido (lib/analytics.ts#loadGtag, requestIdleCallback),
         pero el DNS/TLS de Google Tag Manager conviene resolverlos ya: para
         cuando el idle callback dispare, la conexión ya está lista. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />

    <!--
      TODO EL BLOQUE ENTRE `seo:start` y `seo:end` LO REGENERA EL POSTBUILD.

      `tools/seo/emit-pages.mjs` lo reemplaza completo, en `index.html` y en cada
      página derivada, a partir de `src/lib/seoMeta.ts` — esa es la fuente de
      verdad del copy. Lo que hay acá abajo es el valor del home, y sirve de red
      por si alguien corre `vite build` sin el postbuild; si difiere de
      `seoMeta.ts`, gana `seoMeta.ts`.

      Los marcadores son comentarios y no atributos porque el reemplazo tiene que
      ser de un bloque entero: parchear tag por tag con regex es exactamente cómo
      se termina con un `og:description` del home en una página de ayuda.

      `https://generador-de-horarios.coldideas.com` lo sustituye Vite en el build (ver `.env`). Ninguna de
      estas URLs puede ser relativa: `og:image` relativa es la causa nº1 de
      tarjeta social sin imagen.
    -->
    <!-- seo:start -->
    <title>Página no encontrada — Generador de horarios</title>
    <meta name="robots" content="noindex,follow" />
    <!-- seo:end -->
    <script type="module" crossorigin src="/assets/index-CPHgFMdA.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vendor-vue-38pOCikE.js">
    <link rel="modulepreload" crossorigin href="/assets/vendor-db-SYSzWNrB.js">
    <link rel="stylesheet" crossorigin href="/assets/index-BchAPER-.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
    <!--
      Contenido estático que hornea el postbuild (`#app:not(:empty) + #prerender`
      lo esconde en cuanto Vue monta, ver `style.css`). Es lo ÚNICO que ve un
      crawler que no ejecuta JavaScript, y lo primero que ve un humano con la red
      lenta. Va vacío en el fuente a propósito: el copy vive en `seoMeta.ts` y en
      `helpContent.ts`, duplicarlo acá sería una segunda fuente de verdad.

      Reemplaza al `<h1 class="sr-only">` que estaba acá: describía dos pantallas
      en una sola oración, se repetía en todas las rutas y DUPLICABA el `<h1>`
      que cada vista ya renderiza (`HomeView` "Mis horarios", `HelpView` el
      título del tema…).
    -->
    <div id="prerender"><!-- prerender:start --><!-- prerender:end --></div>
  </body>
</html>
